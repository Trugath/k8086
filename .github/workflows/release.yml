name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Version from tag
        id: ver
        run: echo "release=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build distribution zip
        run: ./gradlew :k8086-app:distZip -PreleaseVersion=${{ steps.ver.outputs.release }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: k8086-app/build/distributions/k8086-*.zip
          generate_release_notes: true
          body: |
            ### Workstation package

            1. Install **JDK 21+**
            2. Download and unzip `k8086-${{ steps.ver.outputs.release }}.zip`
            3. Run **`run.bat`** (Windows) or **`./run.sh`** (Linux / macOS)

            Includes default rmDOS system ROMs (`roms/`) and boot floppy (`disks/fd.img`).
            No Gradle required.
