name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild/update (e.g. v0.8.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v*) ;;
            *)
              echo "Tag must start with v (got: $TAG)" >&2
              exit 1
              ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build distribution zip
        run: ./gradlew :k8086-app:distZip -PreleaseVersion=${{ steps.tag.outputs.release }}

      - name: Unzip smoke (runnable package)
        env:
          REL: ${{ steps.tag.outputs.release }}
        run: |
          set -euo pipefail
          ZIP="k8086-app/build/distributions/k8086-${REL}.zip"
          test -f "$ZIP"
          rm -rf /tmp/k8086-rel-dist
          unzip -q "$ZIP" -d /tmp/k8086-rel-dist
          ROOT="/tmp/k8086-rel-dist/k8086-${REL}"
          test -x "$ROOT/run.sh"
          test -x "$ROOT/run-cli.sh"
          test -x "$ROOT/bin/k8086"
          test -f "$ROOT/roms/u18.bin"
          test -f "$ROOT/roms/u19.bin"
          test -f "$ROOT/disks/fd.img"
          SERIAL=/tmp/k8086-rel-serial.log
          : >"$SERIAL"
          "$ROOT/run-cli.sh" disks/fd.img --headless --quiet \
            --serial-log "$SERIAL" --cga-expect 'A:>' --no-floppy-int13-shim
          grep -q 'A:>' "$SERIAL"

      - name: Stage release asset
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REL: ${{ steps.tag.outputs.release }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -f "k8086-app/build/distributions/k8086-${REL}.zip" "dist/k8086-${TAG}.zip"
          ls -la dist

      - name: Write release preamble
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REL: ${{ steps.tag.outputs.release }}
        run: |
          cat > dist/RELEASE_PREAMBLE.md <<EOF
          ## Workstation package

          1. Install **JDK 21+** (\`java\` on \`PATH\`, or \`JAVA_HOME\`)
          2. Download and unzip \`k8086-${TAG}.zip\`
          3. Run the UI: **\`run.bat\`** (Windows) or **\`./run.sh\`** (Linux / macOS)
          4. Or CLI / headless: **\`./run-cli.sh disks/fd.img --headless\`**

          Includes default rmDOS ROMs (\`roms/\`) and boot floppy (\`disks/fd.img\`).
          No Gradle required.

          EOF
          sed -i 's/^[[:space:]]*//' dist/RELEASE_PREAMBLE.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          FILE="dist/k8086-${TAG}.zip"
          PREV="$(gh release list --limit 20 --json tagName \
            --jq '[.[] | select(.tagName != env.TAG)][0].tagName // empty' || true)"
          NOTES="$(mktemp)"
          {
            cat dist/RELEASE_PREAMBLE.md
            echo "## Changelog"
            echo
            if [ -n "${PREV}" ]; then
              gh api "repos/${REPO}/releases/generate-notes" \
                -f tag_name="$TAG" -f previous_tag_name="$PREV" \
                --jq .body
            else
              gh api "repos/${REPO}/releases/generate-notes" \
                -f tag_name="$TAG" \
                --jq .body
            fi
          } > "$NOTES"
          if [ "$EVENT" = "workflow_dispatch" ] && gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" "$FILE" \
            --title "k8086 ${TAG}" \
            --notes-file "$NOTES" \
            --verify-tag
